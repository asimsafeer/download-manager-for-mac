<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Split Stream: parallel download segments dropping onto a tray. Original artwork. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a86ff"/>
      <stop offset="1" stop-color="#2a2cb4"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="bar" gradientUnits="userSpaceOnUse" x1="0" y1="200" x2="0" y2="760">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cddcff"/>
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dy="16" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope=".38"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glyph" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope=".30"/></feComponentTransfer>
      <feColorMatrix type="matrix" values="0 0 0 0 .04  0 0 0 0 .05  0 0 0 0 .35  0 0 0 1 0" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <g filter="url(#drop)"><rect x="100" y="100" width="824" height="824" rx="186" fill="url(#body)"/></g>
  <g clip-path="url(#clip)"><rect x="100" y="100" width="824" height="430" fill="url(#sheen)"/></g>
  <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <g filter="url(#glyph)" transform="translate(0 -16)">
    <g fill="url(#bar)">
      <rect x="468" y="215" width="88" height="100" rx="44"/>
      <rect x="468" y="345" width="88" height="100" rx="44"/>
      <rect x="468" y="475" width="88" height="217" rx="44"/>
    </g>
    <path d="M320 500L512 692L704 500" fill="none" stroke="url(#bar)" stroke-width="88" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="245" y="790" width="534" height="60" rx="30" fill="#fff" fill-opacity=".62"/>
  </g>
</svg>
